name: fathom
description: "Fathom — a deep, minimalist, ethereal local music player by pharmaracist."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  on_audio_query: ^2.9.0
  tabler_icons_plus: ^3.49.0
  shared_preferences: ^2.5.5
  shared_preferences_android: ">=2.4.28 <2.5.0"
  # The Material color utilities that generate Fathom's tonal palettes.
  material_color_utilities: ^0.13.0
  palette_generator_plus: ^1.0.0
  volume_controller: ^3.7.1
  # The remote music source (see lib/services/yt_source.dart). Wraps NewPipe
  # Extractor — native Kotlin, no Python runtime, no JS runtime — and is used
  # only to *fetch* audio. Nothing remote is ever streamed, so Fathom never
  # needs a live stream address to stay valid.
  #
  # GPL-3.0, inherited from NewPipe Extractor: acceptable only because Fathom
  # is private and undistributed. Publishing it would force Fathom to GPL-3.0.
  newpipeextractor_dart: ^2.0.2
  path_provider: ^2.1.5
  # Minimal ffmpeg-kit build: the app only runs a stream-copy mp4 remux
  # (see lib/services/downloads.dart), which core FFmpeg covers. The full
  # variant adds ~163 MB of unused native libs per build.
  ffmpeg_kit_flutter_new_min: ^3.6.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
          weight: 400

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icons/icon_fallback.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/branding/icons/fg.png"
  # Android 13+ themed icons: launcher tints this layer with wallpaper colors
  adaptive_icon_monochrome: "assets/branding/icons/fg.png"
  adaptive_icon_foreground_inset: 28
