org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# ABIs are not configured here or in app/build.gradle.kts. A `splits { abi { ... } }`
# block used to live there, and it collided with the Flutter Gradle plugin's own
# `ndk.abiFilters` injection ("Conflicting configuration ... in ndk abiFilters
# cannot be present when splits abi filters are set"). That conflict is raised by
# AGP while creating variants — during configuration — so no `afterEvaluate` in a
# build script can correct it, and the plugin's `disable-abi-filtering` opt-out
# cannot be set from this file either, because it is read with
# `Project.findProperty` on `:app`, which never consults a properties file.
#
# With no splits block there is nothing to conflict with, so a plain build
# produces one APK and `flutter run` can find it. Split APKs remain available on
# demand through `flutter build apk --split-per-abi`.

# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
